<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>stampsort</title>
<meta name="description" content="水印照片按时间分类 + 6 寸打印排版">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #677085; --line: #e2e6ee;
  --accent: #1f6feb; --accent-text: #fff; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e;
  --bad-bg: #ffebe9; --warn-bg: #fff8c5; --chip: #eef1f6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a5; --line: #2a313c;
    --accent: #4493f8; --accent-text: #0d1117; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    --bad-bg: #3c1618; --warn-bg: #3a2e0b; --chip: #21262d;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; gap: 10px; margin: 4px 0 16px; }
header img { width: 32px; height: 32px; border-radius: 8px; }
header h1 { font-size: 20px; margin: 0; }
header .sub { color: var(--muted); font-size: 13px; }
header button { margin-left: auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.hidden { display: none !important; }
a.btn { display: inline-block; text-decoration: none; }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
input[type=password] { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px 12px; text-align: center; color: var(--muted); transition: .15s; }
.drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.drop .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.files { margin-top: 10px; font-size: 13px; color: var(--muted); word-break: break-all; }
.opts { display: grid; gap: 12px; margin-top: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row > .label { width: 72px; color: var(--muted); font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg label { padding: 6px 12px; cursor: pointer; font-size: 14px; }
.seg input { display: none; }
.seg label:has(input:checked) { background: var(--accent); color: var(--accent-text); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; margin-right: 12px; }
.go { width: 100%; margin-top: 16px; padding: 12px; font-size: 16px; }
.bar { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; margin: 10px 0 6px; }
.bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.status { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; gap: 10px; flex-wrap: wrap; }
.actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.list { margin-top: 12px; border-top: 1px solid var(--line); }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
.item .name { word-break: break-all; }
.item .time { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.item .note { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.item.bad { background: var(--bad-bg); }
.item.bad .time { color: var(--bad); }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--chip); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
.tag.ocr { color: var(--ok); }
.tag.exif, .tag.filename { color: var(--warn); }
.msg { padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); font-size: 14px; margin-top: 10px; }
.msg.err { background: var(--bad-bg); color: var(--bad); }
.msg.ok { background: var(--chip); }
.foot { color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon-192.png" alt="">
    <div><h1>stampsort</h1><div class="sub">水印时间分类 · 6 寸打印排版</div></div>
    <button id="logout" class="hidden" type="button">退出</button>
  </header>

  <section id="login" class="card hidden">
    <form id="loginForm">
      <p style="margin-top:0">请输入访问密码</p>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="primary go" type="submit">登录</button>
      <div id="loginErr" class="msg err hidden"></div>
    </form>
  </section>

  <section id="upload" class="card hidden">
    <div id="drop" class="drop">
      <div>把照片或 zip 压缩包拖到这里</div>
      <div class="btns">
        <label class="btn primary">选择照片<input id="pickImg" type="file" accept="image/jpeg,image/png" multiple hidden></label>
        <label class="btn">选择压缩包<input id="pickZip" type="file" accept=".zip,application/zip" multiple hidden></label>
      </div>
      <div id="files" class="files"></div>
    </div>
    <div class="opts">
      <div class="row"><span class="label">处理内容</span>
        <span class="seg">
          <label><input type="radio" name="mode" value="all" checked>分类 + 6寸</label>
          <label><input type="radio" name="mode" value="sort">只分类</label>
          <label><input type="radio" name="mode" value="print">只 6 寸</label>
        </span></div>
      <div class="row" id="layoutRow"><span class="label">6 寸排版</span>
        <span class="seg">
          <label><input type="radio" name="layout" value="c" checked>保留画面</label>
          <label><input type="radio" name="layout" value="crop">纯裁切</label>
        </span></div>
      <div class="row" id="extraRow"><span class="label">附加</span>
        <label class="check"><input type="checkbox" id="pdf" checked>合成 PDF</label>
        <label class="check"><input type="checkbox" id="bleed">出血版 2.5%</label>
      </div>
      <div class="sub" style="color:var(--muted);font-size:12px">保留画面：顶部少裁一点，水印不变形，主体轻微竖向压缩；纯裁切：完全不变形，只从顶部裁到 3:2。</div>
    </div>
    <button id="start" class="primary go" type="button" disabled>开始处理</button>
    <div id="ocrWarn" class="msg hidden">服务器没有加载 OCR，只能按 EXIF / 文件名识别时间。</div>
  </section>

  <section id="progress" class="card hidden">
    <div id="stage" style="font-weight:600">上传中…</div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="status"><span id="count"></span><span id="eta"></span></div>
    <div id="jobMsg" class="msg hidden"></div>
    <div class="actions">
      <a id="download" class="btn primary hidden" href="#">下载结果 zip</a>
      <button id="cancel" type="button">取消</button>
      <button id="again" class="hidden" type="button">再处理一批</button>
    </div>
    <div id="list" class="list"></div>
  </section>

  <p class="foot">打印：10x15cm(4x6in) / 横向 / 光泽照片纸；PDF 用"实际大小/100%"打印。</p>
</main>
<script src="app.js"></script>
</body>
</html>
